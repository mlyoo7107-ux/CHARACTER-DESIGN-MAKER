<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLOR.M AI Character Design Maker</title>
  <meta name="description" content="목적 → 타깃 → 브리프 → 콘셉트 → 형태 → 컬러 → 아이덴티티 → 활용. 목적에 맞는 캐릭터를 처음부터 기획하는 COLOR.M 캐릭터 디자인 메이커">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-head" id="appHead">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="assets/logo.png" alt="COLOR.M">
      <span class="tag">AI CHARACTER DESIGN MAKER</span>
    </div>
    <div class="top-actions">
      <a class="btn ghost" id="btnGallery" href="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery/index.html?product=CHARACTER_MAKER" target="_blank" rel="noopener">작품 갤러리</a>
      <button type="button" class="btn ghost" id="btnLoad">불러오기</button>
      <button type="button" class="btn ghost" id="btnSave">저장</button>
      <button type="button" class="btn ghost" id="btnNew">새 캐릭터</button>
    </div>
  </header>

  <nav class="stepper" id="stepper" aria-label="단계"></nav>
  </div>

  <div class="layout">
    <main id="main"></main>
    <aside id="side" aria-label="캐릭터 카드"></aside>
  </div>

  <footer class="site-footer">
    <img src="assets/logo.png" alt="COLOR.M">
    <p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p>
  </footer>

  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <input type="file" id="refInput" accept="image/*" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/color.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
